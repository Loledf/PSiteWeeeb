<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Расследование — PSiteWeb</title><style>
:root{color-scheme:dark;--bg:#0b0c0e;--card:#17191c;--line:#36383c;--text:#f6f6f6;--mut:#a0a4ab}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}header{border-bottom:1px solid var(--line);background:var(--card)}.bar{max-width:1050px;margin:auto;padding:17px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{font-size:18px;font-weight:600;color:var(--text);text-decoration:none}.back{color:var(--mut);text-decoration:none}.back:hover{color:var(--text)}main{max-width:900px;margin:70px auto;padding:0 22px}.eyebrow{font:12px ui-monospace,monospace;color:var(--mut);letter-spacing:2px;text-transform:uppercase}.panel{margin-top:20px;padding:clamp(22px,5vw,46px);border:1px solid var(--line);background:var(--card)}.top{display:flex;justify-content:space-between;gap:12px;color:var(--mut);font:13px ui-monospace,monospace}h1{font-size:clamp(29px,5vw,48px);font-weight:400;line-height:1.15;letter-spacing:-1.5px;margin:30px 0 16px}p{color:var(--mut);white-space:pre-line}.info{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0;border-top:1px solid var(--line);padding-top:18px;color:var(--mut);font:13px ui-monospace,monospace}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.btn{display:inline-flex;padding:12px 19px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600}.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}.btn:hover{opacity:.8}.error{color:#f3b3b3}footer{max-width:900px;margin:50px auto;padding:20px 22px;color:var(--mut);border-top:1px solid var(--line);font-size:12px}
</style></head><body><header><div class="bar"><a class="logo" href="index.html">PSiteWeb</a><a class="back" href="index.html#reports">← Все расследования</a></div></header><main><div class="eyebrow">// Расследования / Отчёт</div><article class="panel" id="report"><p>Загрузка расследования...</p></article></main><footer>PSiteWeb · Материалы расследований</footer><script>
const root=document.getElementById('report');const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=String(txt);return n};
const file=new URLSearchParams(location.search).get('id');
const valid=file&&/^[a-zA-Z0-9_-]+\.json$/.test(file);
const safeLink=v=>{try{const u=new URL(v,location.href);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}};
(async()=>{try{if(!valid)throw Error('Неверный идентификатор отчёта');const r=await fetch('report_cards/'+file+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Отчёт не найден');const d=await r.json();if(d.enabled===false||d.category!=='reports')throw Error('Отчёт недоступен');document.title=d.title+' — PSiteWeb';root.replaceChildren();const top=el('div','top');top.append(el('span','',d.number||'ОТЧЁТ'),el('span','',String(d.type||'REPORT').toUpperCase()));root.append(top,el('h1','',d.title),el('p','',d.full_description||d.description||''));if(d.meta)root.append(el('div','info',d.meta));const actions=el('div','actions');const back=el('a','btn','← Назад к расследованиям');back.href='index.html#reports';actions.append(back);const url=d.link&&safeLink(d.link);if(url){const a=el('a','btn primary',d.button||'Скачать PDF');a.href=url;a.download=String(d.link).split('/').pop();actions.append(a)}root.append(actions)}catch(e){root.replaceChildren(el('p','error',e.message));const a=el('a','btn','← Вернуться на сайт');a.href='index.html#reports';root.append(a)}})();
</script></body></html>
